<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reagister</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="img.css">
    <link rel="stylesheet" href="background.css">
</head>
<body>
    <!-- Menu-->
    <div id="menu-container"></div>

    <!-- Register -->
    <div class="container  ">

        <form id="form1">
        <div class="row  ">
            <div class="col-md-6 mx-auto mt-5 bg-light   rounded">
                <div class="h3 text-center	text-primary mt-3 ">Register</div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Firstname - Lastname</label>
                    <input type="text" class="form-control" id="firstname-lastname" placeholder="firstname - lastname" required>
                </div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" id="textDetail" rows="3" required></textarea>
                </div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="Username" placeholder="Username" required>
                </div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Password</label>
                    <input type="Password" class="form-control" id="Password" placeholder="Password" required>
                </div>
                <div class="text-center mb-4">
                    <input type="submit" id="submit" class="btn btn-primary" value="Submit">
                    <input type="reset" id="reset" class="btn btn-danger" value="Cancel">
                </div>
            </div>
        </div>
        </form>
    </div>
    <div id="footer"></div>
</body>
</html>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
