<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-secondary">

    <div class="container">

        <form id="form1" onsubmit="login(event)">

            <div class="row">
                <div class="col-md-6 mx-auto mt-5 bg-light rounded p-4">

                    <div class="h3 text-center text-primary mt-3">
                        Login
                    </div>

                    <div class="mb-3 mt-4">
                        <label class="form-label">Username</label>

                        <input type="text"
                            class="form-control"
                            id="Username"
                            placeholder="Username"
                            required>
                    </div>

                    <div class="mb-3 mt-4">
                        <label class="form-label">Password</label>

                        <input type="password"
                            class="form-control"
                            id="Password"
                            placeholder="Password"
                            required>
                    </div>

                    <div class="text-center mb-4">

                        <!-- ไม่ต้องใช้ <a> ครอบปุ่ม -->
                        <button type="submit"
                            id="submit"
                            class="btn btn-primary">
                            Login
                        </button>

                        <a href="register.html"
                            class="btn btn-secondary">
                            Register
                        </a>

                    </div>

                </div>
            </div>

        </form>
    </div>


    <script>
        function login(event) {

            // ป้องกัน form รีเฟรชหน้า
            event.preventDefault();

            const username =
                document.getElementById("Username").value;

            const password =
                document.getElementById("Password").value;


            // ตรวจสอบ Username และ Password
            if (username === "admin" && password === "1234") {

                // Login สำเร็จ
                window.location.href = "produact.html";

            } else {

                // Login ไม่สำเร็จ
                alert("Username หรือ Password ไม่ถูกต้อง");

            }
        }
    </script>

</body>
</html>
